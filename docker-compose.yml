version: "3.8"

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  api:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A app.celery_app worker -Q pdf,ai,default --loglevel=info --concurrency=2
    env_file: .env
    depends_on:
      - redis
      - api

volumes:
  redis-data: